<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>판교-청라 업무지구 비교분석</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <section class="map-pane" aria-label="비교 지도">
      <div id="map"></div>
      <div class="map-tools" aria-label="지도 레이어">
        <button class="tool active" data-layer="land" type="button">경계</button>
        <button class="tool active" data-layer="buildings" type="button">건축물</button>
        <button class="tool active" data-layer="oa" type="button">집계구</button>
        <button class="tool active" data-layer="iso" type="button">접근권</button>
        <button class="tool active" data-layer="stations" type="button">역</button>
      </div>
      <div class="time-tools" aria-label="접근 시간">
        <span>접근권</span>
        <button class="minute active" data-minute="30" type="button">30분</button>
        <button class="minute" data-minute="60" type="button">60분</button>
      </div>
    </section>

    <aside class="panel">
      <header class="panel-head">
        <h1>판교-청라 업무지구 비교분석</h1>
        <p>정적 GeoJSON/JSON 데이터로 토지이용, 교통망, 인구·사회 지표를 한 화면에서 비교합니다.</p>
      </header>

      <nav class="tabs" aria-label="분석 메뉴">
        <button class="tab active" data-tab="overview" type="button">종합</button>
        <button class="tab" data-tab="landuse" type="button">토지이용</button>
        <button class="tab" data-tab="transport" type="button">교통망</button>
        <button class="tab" data-tab="demo" type="button">인구사회</button>
      </nav>

      <section class="tab-page active" id="overview">
        <h2>종합 비교</h2>
        <div id="summaryCards" class="cards"></div>
        <div id="insightList" class="insight"></div>
      </section>

      <section class="tab-page" id="landuse">
        <h2>토지이용 비교</h2>
        <div id="landMetrics" class="metric-grid"></div>
        <h3>건축물 용도 구성</h3>
        <div id="useCompare"></div>
        <h3>용도지역 구성</h3>
        <div id="zoneCompare"></div>
        <h3>주요 건축물 표본</h3>
        <div id="buildingCompare"></div>
      </section>

      <section class="tab-page" id="transport">
        <h2>교통망 비교</h2>
        <div id="transportMetrics" class="metric-grid"></div>
        <h3>역세권 면적 비중</h3>
        <div id="stationAreaChart"></div>
        <h3>접근 시간별 누적 종사자</h3>
        <div id="accessChart"></div>
      </section>

      <section class="tab-page" id="demo">
        <h2>인구사회 비교</h2>
        <div id="demoMetrics" class="metric-grid"></div>
        <h3>핵심 밀도 지표</h3>
        <div id="compareBars"></div>
        <h3>사업체 산업 구성</h3>
        <div id="businessCompare"></div>
        <h3>종사자 산업 구성</h3>
        <div id="workerIndustryCompare"></div>
      </section>

      <footer class="source">
        데이터: 정적 전처리 산출물(site-data.json), 행정경계·집계구·건축물·철도역 기반 비교 지표. 별도 서버 DB 없이 GitHub Pages에서 동작합니다.
      </footer>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
